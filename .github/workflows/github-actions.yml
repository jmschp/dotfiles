name: Test dotfiles
run-name: ${{ github.actor }} is testing dotfiles 🚀
on:
  push:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. The install depends on upstream installers, Homebrew
    # formulae and mise releases; a weekly run catches rot without a push.
    - cron: "0 6 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  aws_access_key_id: fake_aws_access_key_id
  aws_secret_access_key: fake_aws_secret_access_key
defaults:
  run:
    shell: zsh -e {0}
jobs:
  dotfiles-install:
    runs-on: macos-latest
    # The full run takes ~9 minutes; a hung interactive step must not burn hours.
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set ENV file .zshenv
        run: cp dot-files/dot-zshenv ~/.zshenv
      - name: Run Makefile file
        run: make
      - name: Test make results
        run: make test-all
