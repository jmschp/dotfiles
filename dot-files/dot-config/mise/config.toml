# Global mise config: https://mise.jdx.dev/configuration.html
# Project mise.toml / .tool-versions / idiomatic version files override these.
# mise honours XDG_CONFIG_HOME/XDG_DATA_HOME/XDG_CACHE_HOME/XDG_STATE_HOME; no MISE_* vars needed.

[settings]
# Read .nvmrc/.node-version/package.json, .ruby-version/Gemfile, .python-version(s),
# like asdf's `legacy_version_file = yes`.
idiomatic_version_file_enable_tools = ["node", "python", "ruby"]
# Trusted without a `mise trust` prompt: only trees whose mise.toml files I or my
# team write. A trusted mise.toml runs [env], [hooks] and postinstall code on `cd`,
# so anything else cloned under ~/code must be trusted explicitly, once per directory.
trusted_config_paths = ["~/code/dotfiles", "~/code/ln", "~/code/legado-bnai-brith-brasil"]

[settings.node]
# Same as ASDF_NODEJS_AUTO_ENABLE_COREPACK=true.
corepack = true

[tools]
node = "lts"
python = "3"
rust = "stable"
# Claude Code from Anthropic's GitHub release tarballs (checksummed). Its own updater must not
# touch a mise-managed install (DISABLE_AUTOUPDATER=1 in dot-claude/settings.json), so mise
# updates it instead: auto_update checks once per tool_update.check_duration (24h) and, in an
# activated shell, upgrades in the background at the next prompt. Manual: `mise upgrade claude`.
claude = { version = "latest", auto_update = true }

[tools.ruby]
version = "4"
# Replaces dot-config/asdf/default-gems: runs once after this Ruby is installed, with its bin on PATH.
# `make test-mise-tools` reads this list back with `mise config get tools.ruby.postinstall`.
postinstall = "gem install --no-document htmlbeautifier ruby-lsp ruby-lsp-rails ruby-lsp-rspec rubocop rubocop-factory_bot rubocop-performance rubocop-rails rubocop-rake rubocop-rspec webrick"
